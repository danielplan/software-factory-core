# A PostgreSQL server on this computer, for when there is no other:
# `npm run db:start` (Docker's `docker compose up -d --wait`) starts it and
# waits until it answers; `npm run db:stop` stops it, keeping its data. It
# answers only on this computer, on port 55432 (DATABASE_PORT changes it), with
# the password below meant for local development only. Every backend made
# from the kit's starter shares this one server (the name below), each with
# databases of its own on it: `.env.example` points DATABASE_URL at it, and
# `npm run migrate` makes the databases.
name: software-factory-postgres
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-55432}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  database:
