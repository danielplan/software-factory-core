# Every check the core has (`npm run verify`), on each pull request and each
# push to main: the same as the pre-push hook, on a clean machine.
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # The tests make git repositories of their own and commit in them.
      - run: |
          git config --global user.name "Factory checks"
          git config --global user.email "checks@example.com"
          git config --global init.defaultBranch main
      - run: npm ci
      - run: npm run verify
